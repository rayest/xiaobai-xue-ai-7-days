<script>
const D=[
{k:"现场拆解 / 开场",t:"AI 能不能真的帮你做工具？",l:"从一个真实需求出发，看 AI 如何在 Harness 工程的约束、反馈和验证中，完成一次可用工具开发。",c:[["01","不是展示 AI 写出几百行代码，而是观察它能不能把事情做完。"],["02","不是只看 Demo 是否能跑，而是看需求、测试、错误和维护是否闭环。"],["03","不是把判断交给 AI，而是把重复劳动交给 AI。"]],cl:"cover",f:"线下分享课｜AI × Harness Engineering",n:"开场先问观众：你有没有一个每天重复做、但一直没做成工具的工作？"},
{k:"01 / 先定义问题",t:"真正的需求，通常不是\n“帮我做个网页”",l:"AI 最容易被误导的地方，是一开始就进入实现。先把需求变成可验收的结果。",c:[["谁在用？","一个具体角色，而不是“所有人”。<small>例：项目负责人整理会议纪要。</small>"],["输入是什么？","文件、文本、表格、时间范围和必填字段。"],["输出是什么？","页面、表格、任务清单，还是一封可发送的邮件？"],["何时算完成？","用 3—5 条可观察的验收标准写出来。"]],q:"需求越具体，AI 越像开发者；需求越模糊，AI 越像猜谜者。",f:"第一原则：先定义可验收的结果",n:"让观众把自己的需求改写成“谁在什么场景下，用什么输入，得到什么结果”。"},
{k:"02 / 一个真实需求",t:"现场案例：\n把会议纪要变成行动清单",l:"我们要做的不是“漂亮的纪要页面”，而是减少会后遗漏，让每一项行动都有人、期限和状态。",m:[["要素","首版定义","不做什么"],["输入","粘贴会议纪要 / 上传 Markdown","不接入所有会议平台"],["识别","行动项、负责人、截止日期、依赖","不替人猜负责人"],["输出","可编辑任务表 + Markdown 导出","不自动发消息"],["验收","20 份真实纪要，关键字段准确且可修改","不追求一次覆盖所有格式"]],f:"案例目标：让一个高频、低风险、边界清楚的流程先跑通",n:"强调首版的克制：不接外部系统、不自动发送、不解决所有会议格式。"},
{k:"03 / 需求到工程",t:"把需求翻译成\nAI 可以执行的任务卡",l:"Agent 不应该一次接收一个“做完全部”的大愿望，而应该接收有边界、有产出、有验证方式的小任务。",flow:[["任务 1","创建最小页面与输入区"],["任务 2","定义任务数据结构与示例"],["任务 3","实现解析与编辑表格"],["任务 4","加入导出与错误提示"],["任务 5","跑测试并修复回归"]],c:[["每张卡都要有","目标、涉及文件、完成标准、验证命令"],["每次只改什么","一个相对独立的能力，避免同时改 UI、数据和部署"],["交付给下一步","代码 + 测试结果 + 未解决问题"]],f:"任务卡是人和 Agent 之间的工作接口",n:"现场展示一张任务卡。指出“做一个好用工具”不是任务，“实现可编辑任务表并通过三条测试”才是。"},
{k:"04 / Harness Engineering",t:"Harness 不是一个提示词，\n而是一套让 AI 能工作的工程系统",l:"它把仓库变成 Agent 可理解、可操作、可验证的工作空间。",c:[["上下文","目录、文档、数据模型和当前任务，让 AI 知道项目是什么。"],["约束","编码规范、边界、权限和不可触碰的区域，让 AI 知道不能做什么。"],["工具","测试、构建、浏览器检查、脚本和日志，让 AI 能采取行动。"],["反馈","明确的失败信息和验收结果，让 AI 能修正，而不是继续猜。"]],cl:"dark",q:"Harness 的目标不是让 AI 更聪明，而是让正确的下一步更容易发生。",f:"Harness = Context + Constraints + Tools + Feedback",n:"这里把 harness engineering 定义为工程设计问题，而不是某个软件产品。"},
{k:"05 / 仓库作为接口",t:"一个好的仓库，\n本身就是给 Agent 的说明书",l:"不要依赖每次对话临时解释。把稳定信息放进项目，让上下文可复用、可审查。",code:"project/\n├── AGENTS.md                  # 工作规则与边界\n├── README.md                  # 如何运行、如何验收\n├── app/                       # 产品代码\n├── tests/                     # 真实验收样例\n├── scripts/\n│   └── verify.sh              # 一条命令完成检查\n└── docs/\n    ├── product.md             # 需求与非目标\n    └── decisions.md           # 关键取舍记录",a:"关键不是文件名本身，而是让 Agent 能回答：我现在在哪？要改什么？怎样证明改对了？",f:"让项目具备可读的结构、可执行的命令、可追溯的决定",n:"说明文档不是越多越好。优先补齐 Agent 每次都需要、且容易理解错的那部分。"},
{k:"06 / 约束与权限",t:"把“不要乱改”变成\n机器可以检查的边界",l:"安全边界不能只写在自然语言里；能自动检查的，就交给脚本和权限系统。",c:[["文件边界","明确允许修改的目录，生成文件放到固定位置。"],["命令边界","安装、删除、发布、外发等动作默认需要确认。"],["数据边界","真实客户数据、密钥和隐私信息不进入测试样例。"],["产品边界","首版只生成任务草稿，不自动通知、不替人承诺。"]],cl:"two",q:"能被拒绝的危险动作，才是真正写清楚的边界。",f:"最小权限：让 Agent 拥有完成任务所需的能力，而不是全部能力",n:"结合案例说明：导出任务可以自动做，发送给全员应该停下来确认。"},
{k:"07 / 验证系统",t:"没有验证，\nAI 只是“看起来完成了”",l:"Harness 最关键的部分，是把“我觉得不错”变成 Agent 可以反复运行的检查。",flow:[["静态检查","类型、Lint、格式和依赖"],["单元测试","解析日期、负责人、空输入等规则"],["样例测试","20 份真实纪要的预期输出"],["界面检查","关键流程能打开、编辑、导出"],["人工验收","事实不被臆测，边界提示清楚"]],c:[["测试不只测成功","也要测空输入、冲突信息、缺失负责人和奇怪格式。"],["测试集要真实","脱敏后的真实材料，比编造的完美样例更有价值。"]],f:"验证的作用：给 Agent 一个清晰的“下一步该修什么”",n:"现场可以故意放入一份缺少日期的纪要，看工具是否诚实提示缺失，而不是编造日期。"},
{k:"08 / 反馈回路",t:"Agent 的工作循环：\n改动 → 运行 → 观察 → 修正",l:"真正的生产力来自短反馈回路，而不是一次生成大量代码。",flow:[["读取","理解任务、规则、已有实现"],["改动","只修改完成当前任务所需的文件"],["运行","执行 verify.sh、测试或浏览器检查"],["观察","读取失败信息、截图和输出差异"],["修正","定位原因，修复，再次验证"]],q:"让每一次失败都变成下一次行动的证据。",f:"好的 Harness 会缩短反馈回路，减少 Agent 的盲目探索",n:"强调“测试失败信息”要能指向问题。模糊的“失败了”对人和 Agent 都没有帮助。"},
{k:"09 / 现场开发",t:"现场不只展示成功，\n要展示一次真实失败",l:"观众真正想知道的是：出了问题怎么办？谁发现？如何判断是需求错、代码错，还是环境错？",m:[["现象","可能原因","下一步动作"],["日期解析错误","输入格式未覆盖","补充样例与解析规则"],["任务重复出现","缺少稳定 ID","调整数据模型和测试"],["导出乱码","编码约定不清","固定 UTF-8 并加入回归测试"],["页面能跑但不好用","验收只测了代码","加入界面操作检查"]],f:"失败不是演示事故，而是 Harness 发挥作用的时刻",n:"现场演示最好预留一个可控失败点，然后展示 Agent 如何根据反馈修复。"},
{k:"10 / 人与 AI 的分工",t:"AI 负责推进，\n人负责判断",l:"Harness 让 Agent 可以自主完成更多执行工作，但不会替人承担产品和业务责任。",c:[["交给 AI","搭页面、写样板代码、补测试、定位报错、重构重复逻辑。"],["由人决定","需求优先级、产品边界、异常处理、数据口径和取舍。"],["必须确认","外部发送、数据删除、正式发布、敏感决策和不可逆操作。"]],cl:"dark",q:"人不再逐行指挥代码，但必须把关方向、边界和结果。",f:"协作原则：人给目标和判断，AI 做执行和迭代",n:"避免把 AI 编程讲成完全自动化。好的分工是让人从低价值执行中释放出来。"},
{k:"11 / 从 Demo 到工具",t:"能跑起来只是起点，\n可维护才算交付",l:"一个现场 Demo 之后，还需要把它变成别人敢用、以后能改的东西。",c:[["可复现","新环境能按 README 启动，验证命令不依赖某次对话。"],["可观察","有日志、错误信息和版本记录，知道哪里出了问题。"],["可回滚","改动有边界，关键版本能比较，坏了能恢复。"],["可迭代","真实样例不断加入，验收标准随使用反馈更新。"]],grid:"two",f:"交付标准：另一个人能理解、运行、验证并继续修改",n:"问观众：如果明天换一个人接手，这个工具能不能继续工作？这就是维护性测试。"},
{k:"12 / 收束",t:"AI 做工具的关键，\n不是 Prompt，而是工程闭环",l:"从真实需求开始，用 Harness 把上下文、约束、工具、反馈和验证组织起来。",c:[["第一步","选一个高频、低风险、输入输出相对稳定的任务。"],["第二步","写清任务卡、非目标和验收标准。"],["第三步","为 Agent 准备可读的仓库、可执行的检查和明确的反馈。"],["第四步","让它做小步迭代，用真实样例证明价值。"]],cl:"cover",q:"不要问“AI 能不能替我做完所有事”。\n先问：哪一段重复工作，值得被工程化？",f:"下一步：带走一个需求，做一次两周小试点",n:"最后让每个人写下自己的一个候选需求，并补上“输入、输出、验收、不能做什么”四句话。"}
,{k:"13 / 先判断价值",t:"不是所有需求，\n都值得马上做成工具",l:"先筛选高频、可验收、低风险的任务，才能在短周期内获得真实反馈。",c:[["重复出现","同一类工作每周或每天发生，方法已经相对稳定。"],["结果可描述","完成与否能用字段、状态、规则或用户动作判断。"],["风险可控制","可以从本地、草稿或沙箱开始，不必一开始接生产系统。"]],q:"最适合 AI 开发的第一件事，不是最宏大的产品，而是最容易形成反馈的工作。",f:"选题标准：频率 × 可验收性 × 可控风险",n:"让观众用自己的一个想法做筛选，不符合三项的先不要进入开发。"},
{k:"14 / 裸模型对照",t:"只有一句 Prompt，\n为什么很难交付？",l:"裸模型可以快速给出起点，但它缺少项目事实、操作边界和判断结果的外部证据。",m:[["缺口","表现","工程后果"],["上下文","不知道项目结构、已有决定和真实输入","重复改错文件或重写已有能力"],["约束","不知道哪些功能不做、哪些动作需确认","范围膨胀或产生外部副作用"],["反馈","看不到运行状态、测试结果和界面行为","把“能生成”误当成“已完成"],["验证","没有明确的完成标准","问题只能靠主观感觉发现"]],f:"裸模型适合探索；Harness 让探索进入可交付流程",n:"强调对照的目的不是贬低模型，而是说明为什么需要模型之外的工程系统。"},
{k:"15 / 上下文编译",t:"Agent 每次行动前，\n都需要一份有效上下文",l:"上下文不是把所有聊天记录无限追加，而是筛选、压缩、排序并组合当前真正相关的信息。",code:"context = compile(\n  goal, project_state, relevant_files,\n  tests, tool_results, permissions,\n  previous_decisions\n)\naction = model(context)",c:[["要看什么","当前目标、相关文件、已有测试和最近反馈。"],["不要塞什么","与任务无关的历史聊天、过期规则和全部知识库。"],["要保留什么","失败原因、关键取舍、未决问题和验证证据。"]],f:"Context Engineering：决定 Agent 看见什么、忽略什么、先看什么",n:"可以把上下文比作给开发者准备的一份工作包，重点是相关性和新鲜度。"},
{k:"16 / 工具设计",t:"工具越多不一定越强，\n关键是可描述、可观测、可恢复",l:"每个工具都应该有清晰输入、输出、失败方式和权限范围。",c:[["输入契约","参数类型、必填项、默认值和错误提示明确。"],["输出契约","返回结构化状态，而不是只返回一段模糊文本。"],["失败契约","失败原因可定位，区分输入错误、环境错误和业务错误。"],["恢复方式","支持重试、取消、回滚或转人工确认。"]],cl:"two",q:"一个好工具不是让 Agent 做更多事，而是让它更少误判。",f:"工具设计是 Harness 的 API 设计",n:"用会议行动项举例：解析工具可以返回缺失负责人，但不应该擅自猜人名。"},
{k:"17 / Skill、Tool、Memory",t:"四个词要分清，\n否则系统会越做越乱",l:"方法、能力、状态和运行系统各自承担不同职责。",m:[["对象","保存什么","典型例子"],["Prompt","本次任务的即时要求","整理今天的会议记录"],["Skill","可复用的做法和输出方法","按决策—行动—风险输出"],["Tool","可调用的外部能力","读取文件、运行测试、查询 CRM"],["Memory","跨任务保留的事实或经验","上次确认过的客户偏好"],["Harness","把它们组织成可验证闭环的系统","上下文、权限、循环、评估"]],f:"概念分工清楚，后续才知道该改哪一层",n:"提醒观众：不要把所有问题都继续加到 Prompt 里。"},
{k:"18 / 任务协议",t:"让 Agent 每次都交付\n“改动 + 证据 + 风险”",l:"输出格式本身也是 Harness 的一部分，可以减少状态丢失和重复确认。",code:"任务完成报告\n- 目标：完成了什么\n- 改动：哪些文件、哪些行为发生变化\n- 验证：执行了什么命令 / 操作，结果是什么\n- 未验证：哪些环境或路径还没覆盖\n- 风险：下一步需要人确认什么",f:"统一交付协议，让人能快速审查 Agent 的工作",n:"现场可以让观众比较“已完成”与这份结构化报告的差别：后者才方便继续推进。"},
{k:"19 / 评估集",t:"没有评估集，\n就没有可靠的迭代",l:"每次调整 Prompt、Skill、工具或 Harness，都应该在固定基线和未参与调试的样例上比较。",m:[["样例类型","要检查什么","为什么需要"],["正常样例","主流程是否顺利完成","证明基本能力"],["缺失样例","缺字段时是否诚实停下","防止模型臆测"],["冲突样例","矛盾信息是否保留并标注","防止替用户拍板"],["边界样例","权限、格式、设备和资源限制","发现真实环境风险"]],q:"评估不是给 AI 打一个漂亮分数，而是让每次修改可比较。",f:"基线、回归集和 holdout 样例，是持续改进的最低配置",n:"解释 holdout：不要只在已经看过的样例上调到满分。"},
{k:"20 / 观察与日志",t:"没有轨迹，就很难知道\nAgent 为什么失败",l:"记录关键动作、工具调用、输入状态、失败类型、成本和人工介入，才能做系统性改进。",c:[["记录什么","任务 ID、步骤、工具、耗时、错误、重试和最终状态。"],["怎么看","按失败类型聚类，而不是只看成功率。"],["怎么用","把高频失败转成规则、测试、工具改进或人工确认门。"]],cl:"dark",q:"日志不是为了证明 Agent 很忙，而是为了找到下一次最值得修的地方。",f:"可观察性让经验从感觉变成证据",n:"强调记录不等于收集一切数据；只保留能帮助定位和改进的最小信息。"},
{k:"21 / 预算与循环",t:"给 Agent 自主性，\n也要给它时间和权限预算",l:"长循环、无限重试和过多工具调用会放大成本与错误。",c:[["时间预算","超过时限就暂停并报告状态，不继续无休止探索。"],["调用预算","限制工具调用和重试次数，避免循环失控。"],["权限预算","任务完成后收回不再需要的权限。"],["人工门","高风险或不可逆动作停下来请求确认。"]],f:"自主性不是无限放权，而是在预算内持续推进",n:"用“自动发布”举例：即使代码测试通过，也要保留正式发布的人工门。"},
{k:"22 / 自我改进",t:"让 Harness 自我修改之前，\n先准备回归和回滚",l:"系统可以提出对 Prompt、Skill、Memory 或流程的修改，但不能把“自我改进”当成自动变好的证明。",flow:[["观察失败","从轨迹和评估中发现弱点"],["提出修改","只改变一个明确变量"],["回归测试","在基线与 holdout 上比较"],["人工审核","检查副作用、权限和目标是否正确"],["接受或回滚","通过才进入下一版"]],f:"自我改进的底线：目标明确、证据可比、失败可恢复",n:"强调模型自评不能替代外部验证。任何自动改规则的系统都需要版本和回滚。"},
{k:"23 / 组织落地",t:"从个人技巧到团队能力，\n还需要责任人和版本",l:"当一个 Harness 被多人使用，它就不再只是某个人的 Prompt，而是一项需要治理的工程资产。",c:[["维护人","谁负责更新规则、依赖和测试集？"],["版本","改了什么，为什么改，验证结果是什么？"],["权限","谁能运行、写入、发布和批准？"],["反馈渠道","使用者如何报告错误、遗漏和不适用场景？"]],f:"可复用能力的最后一公里：责任、版本、权限和反馈",n:"把个人 Skill 进入团队仓库时，必须补上维护与变更责任。"},
{k:"24 / 练习",t:"现在为你的工作写一张\nHarness 设计卡",l:"不要从“做一个万能助手”开始，从一个两周内可以验证的小流程开始。",code:"需求：谁在什么场景下解决什么问题？\n输入：缺什么信息就必须停下？\n输出：什么结果方便继续工作？\n上下文：Agent 必须知道哪些事实？\n约束：哪些数据、文件和动作不能碰？\n验证：用什么样例、命令和人工标准验收？\n回滚：失败后如何比较和恢复？",f:"练习产出：一张能直接进入开发的设计卡",n:"给观众留出时间填写。可以用会议行动项、内容整理或日报生成作为练习题。"},
{k:"25 / 收束",t:"Harness 的价值，\n是把能力变成结果",l:"模型提供潜在能力；工程系统决定这些能力能否在真实任务中被调用、检查、修正和复用。",c:[["从今天带走","需求拆解、任务协议、上下文、工具、评估和回滚。"],["先做什么","选择一个高频、低风险、可验收的小任务。"],["怎样判断","看真实样例、错误类型、人工介入和维护成本。"]],cl:"cover",q:"不要只问模型有多强。\n要问：我们有没有把它放进一个能工作的系统？",f:"Harness Engineering｜从一次 Prompt，到一套可持续的工作系统",n:"最后回到开场问题：能不能真的帮你做工具，答案取决于你是否建立了可执行、可验证的工程闭环。"}

const deck=document.querySelector('#deck');
function cards(a){return '<div class="grid '+(a.length===4||a.length===6?'two':'')+'">'+a.map(x=>'<div class="card"><span>'+x[0]+'</span>'+x[1]+'</div>').join('')+'</div>'}
function flow(a){return '<div class="flow">'+a.map(x=>'<div class="node"><b>'+x[0]+'</b>'+x[1]+'</div>').join('')+'</div>'}
function matrix(a){return '<div class="matrix">'+a.map((r,i)=>r.map(v=>'<div class="'+(i===0?'head':'')+'">'+v+'</div>').join('')).join('')+'</div>'}
D.forEach((s,i)=>{let b='<section class="slide '+(s.cl||'')+'"><div class="kicker">'+s.k+'</div><h1>'+s.t+'</h1><p class="lead">'+s.l+'</p>';if(s.m)b+=matrix(s.m);if(s.code)b+='<div class="codebox">'+s.code+'</div>';if(s.a)b+='<p class="annotation">'+s.a+'</p>';if(s.flow)b+=flow(s.flow);if(s.c)b+=cards(s.c);if(s.q)b+='<div class="quote">'+s.q+'</div>';b+='<div class="foot"><span>'+s.f+'</span><span>'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div></section>';deck.insertAdjacentHTML('beforeend',b)});
const slides=[...document.querySelectorAll('.slide')],select=document.querySelector('#jump'),notes=D.map(x=>x.n);let current=0;slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' '+s.querySelector('h1').textContent.replaceAll('\n',' ');select.append(o)});function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===current));document.querySelector('#counter').textContent=(current+1)+' / '+slides.length;document.querySelector('#notes').textContent='讲师提示：'+notes[current];document.querySelector('#bar').style.width=((current+1)/slides.length*100)+'%';select.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;history.replaceState(null,'','#'+(current+1))}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);select.onchange=()=>show(Number(select.value));document.querySelector('#toggle').onclick=()=>document.querySelector('#notes').classList.toggle('visible');document.querySelector('#print').onclick=()=>window.print();document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.matches('select,button,input'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#notes').classList.toggle('visible')});show(Math.max(0,(Number(location.hash.slice(1))||1)-1));
</script>
