<script>
const D=[
{k:"现场拆解 / 开场",t:"AI 能不能真的帮你做工具？",l:"今天我们把一个真实需求拆开：从一句想法，到可运行的产品，再到可验证、可继续修改的工具。",c:[["01","真实需求：如何把“做一个太空游戏”变成可执行目标。"],["02","工程现场：AI 如何规划、实现、测试和修复。"],["03","关键问题：什么样的 Harness，能让 AI 把事情做完。"]],cl:"cover",f:"线下分享课｜AI × Harness Engineering",n:"开场问：如果让 AI 帮你做一个工具，你最担心的是不会写代码，还是做出来不能用？"},
{k:"01 / 真实案例",t:"先看最终问题：\n怎样把一个想法变成工具？",l:"我们用一个可以启动、操作、测试和构建的浏览器游戏，观察 AI 辅助开发到底需要哪些工程支撑。",m:[["观察对象","现场要回答的问题","对应证据"],["需求与视觉","模糊想法如何变成体验目标？","设计参考、视觉规范"],["实现","AI 如何把目标分配到代码模块？","src/scene.js、main.js、audio.js"],["扩展","新功能如何加入而不破坏旧功能？","src/combat.js、战斗规则"],["验收","什么证据能说明它真的可用？","verification.md、9 项测试通过"]],f:"真实案例：projects/orbit-game｜今天的主线不是项目汇报，而是方法拆解",n:"告诉观众：接下来不是按时间回顾，而是借这个案例回答一组所有 AI 工具开发都会遇到的问题。"},
{k:"02 / 需求拆解",t:"一句“做个太空游戏”，\n还不能直接开发",l:"AI 需要的不是更多形容词，而是可以被拆成状态、规则、交互和验收的需求。",c:[["体验目标","玩家驾驶飞船穿过星环，躲避陨石并收集能量。"],["核心循环","变道 → 加速 → 收集 / 碰撞 → 得分 → 继续或结算。"],["交互范围","桌面键盘与手机触控都能操作，暂停和重试可用。"],["非目标","首版不做账号、后端、联机和支付；使用本地最高分即可。"]],q:"把愿望变成状态机，AI 才有机会把体验变成代码。",f:"第一步：明确目标、边界和非目标",n:"让观众注意“非目标”这一栏。它能显著减少 Agent 自己扩张范围，避免在现场越做越大。"},
{k:"03 / 需求到任务",t:"把大需求拆成\n一组可以验证的任务卡",l:"不要把“做完一个工具”交给 AI；把它拆成一组有边界、有产出、有验证方式的小任务。",flow:[["场景基础","相机、光照、背景和星环"],["玩家循环","三条航道、变道、速度和暂停"],["规则模块","碰撞、积分、难度和护盾"],["反馈体验","HUD、音效、提示和结算"],["战斗扩展","敌机、激光、弹幕、Boss"],["质量收口","测试、构建、浏览器验证"]],c:[["一张任务卡应写清","目标、涉及文件、完成标准、验证命令"],["任务卡的价值","减少上下文丢失，让每次修改有明确边界"],["交付不只是一段代码","还要返回改了什么、怎么验证、还有什么风险"]],f:"任务拆分让 Agent 从“自由创作”进入“受约束执行”",n:"把这组任务当作今天的路线图：先做最小闭环，再增加复杂功能。"},
{k:"04 / 裸模型对照",t:"如果只给 AI 一句话，\n它会遇到什么？",l:"“帮我做一个太空游戏”可以得到很快的起点，但无法自动保证行为一致、手机可用和后续可维护。",c:[["上下文不足","不知道项目用什么框架、哪些文件已存在、视觉参考是什么。"],["目标漂移","容易不断加功能，忘记最初的核心玩法。"],["验证缺失","页面能打开就以为完成，没测边界、碰撞、暂停和重置。"],["错误难定位","所有逻辑堆在一个文件里，失败反馈无法指向具体模块。"]],cl:"dark",q:"代码生成速度很快；但没有工程系统，返工速度也会很快。",f:"裸模型的限制：看见一次输入，不等于理解整个任务",n:"这一页不要把裸模型讲成“没用”。它适合探索和起步，但不适合承担完整交付。"},
{k:"05 / Harness Engineering",t:"Harness：让 Agent 能持续工作的\n上下文、约束、工具与反馈",l:"Harness 不是一个更长的 Prompt，而是围绕 Agent 设计的一整套工程工作面。",c:[["Context / 上下文","项目结构、README、设计规范、当前任务和历史决定。"],["Constraints / 约束","文件边界、技术选择、性能目标、权限和非目标。"],["Tools / 工具","终端、测试、构建、浏览器、截图、日志和脚本。"],["Feedback / 反馈","失败信息、测试结果、视觉差异、验收记录和人工判断。"]],cl:"dark",f:"Harness = Context + Constraints + Tools + Feedback",n:"强调四者缺一不可：只有上下文没有验证，会产生自信错误；只有工具没有边界，会扩大改动范围。"},
{k:"06 / 上下文",t:"项目怎样让 Agent\n快速找到正确的上下文？",l:"仓库结构、设计说明和验证记录，让 Agent 不必依赖某一次聊天，也能理解当前任务。",code:"projects/orbit-game/\n├── README.md                 # 运行方式、操作说明、项目结构\n├── src/\n│   ├── main.js               # 游戏循环、输入、状态与 HUD\n│   ├── scene.js              # Three.js 场景与几何体\n│   ├── rules.js              # 碰撞、积分、难度规则\n│   ├── combat.js             # 敌机、激光、弹幕、Boss\n│   └── *.test.js              # 规则与战斗测试\n└── design/\n    ├── visual-spec.md        # 视觉目标\n    └── verification.md       # 验证记录",a:"对 Agent 来说，这些不是“项目文档”，而是工作接口：它知道从哪里读规则、改哪里、用什么证明改对了。",f:"上下文的目标：让下一步行动建立在项目事实之上",n:"可现场打开 README 和 verification.md，指出它们分别解决“怎么运行”和“怎么证明”的问题。"},
{k:"07 / 约束",t:"好的 Harness 会主动限制\n“能做但不该做”的事",l:"在真实工具开发中，范围控制和安全边界不是附属要求，而是让 AI 稳定交付的前提。",m:[["风险","案例中的约束","为什么重要"],["范围膨胀","首版不接后端、不加账号和联机","保持可在本地运行、快速验证"],["不可逆操作","不自动发布、不覆盖未知文件","避免把实验改动变成外部事故"],["数据依赖","无需密钥，素材和背景放在项目内","减少环境差异与隐性依赖"],["体验承诺","手机无横向溢出，暂停后状态保持","把“好用”变成可检查条件"]],f:"约束不是降低 AI 能力，而是降低错误动作的代价",n:"补充说明：本项目是低风险游戏，但同样需要边界；如果换成 CRM、财务或客户数据，权限门槛应该更高。"},
{k:"08 / 工具链",t:"让 Agent 不只会写，\n还能够运行、观察和修复",l:"一条完整的开发闭环，需要代码工具、浏览器验证和测试命令共同工作。",flow:[["编辑器 / Agent","读取项目、规划任务、修改文件"],["npm test","验证规则、碰撞、得分和战斗行为"],["npm run build","确认生产构建可完成"],["浏览器","操作桌面与手机交互，检查状态变化"],["截图与日志","确认视觉结果，捕捉 error / warn"]],c:[["没有浏览器验证","无法知道按钮是否可点、手机是否溢出、暂停是否真的停止。"],["没有单元测试","规则改动可能悄悄破坏碰撞、积分或边界。"]],f:"工具的价值：把“我猜它对”变成“我运行过它”",n:"讲清工具之间的分工：单元测试测规则，构建测交付，浏览器测真实使用。"},
{k:"09 / 反馈回路",t:"AI 开发的核心循环：\n改动 → 运行 → 观察 → 修正",l:"Agent 的效率不在于一次生成多少代码，而在于每次失败能否快速获得下一步证据。",flow:[["读取事实","看当前文件与既有行为"],["提出改动","只完成一个明确任务"],["执行验证","测试、构建或浏览器操作"],["读取反馈","报错、截图、分数、护盾和控制台"],["最小修复","定位原因，修复并回归"]],q:"失败本身不是问题；没有反馈、没有归因、没有回归，才是问题。",f:"短反馈回路，是 Harness 放大模型能力的地方",n:"可用“手机无横向溢出”举例：这是观察结果，不是抽象审美；它直接反馈到 CSS 和布局修复。"},
{k:"10 / 真实失败",t:"真正值得看的不是第一次成功，\n而是失败后如何修复",l:"复杂功能一定会引入跨模块问题。好的 Harness 把失败拆成可定位、可修复、可回归的工程问题。",m:[["现象","定位线索","修复与回归"],["暂停后分数继续变化","游戏循环状态未冻结","修复状态切换，再验证暂停与恢复"],["边缘航道看不全","手机镜头与场景范围不匹配","拉远镜头，再检查手机截图"],["Boss 弹幕难以躲避","生成逻辑需要保留安全航道","调整规则，并加入 Boss 行为测试"],["构建体积出现警告","Three.js 打包方式不理想","单独打包并重新构建"]],f:"把失败翻译成：现象、原因、改动、回归证据",n:"告诉观众：不要让 Agent 连续重试到“看起来好了”。先记录失败类型，再做最小修改。"},
{k:"11 / 验证不是一句“测过了”",t:"如何证明这个工具\n真的能用？",l:"把验证分成代码规则、生产构建和真实交互三层，每一层回答不同的问题。",c:[["规则验证","航道边界、跨帧碰撞、相邻航道安全、积分和难度上限。"],["战斗验证","敌机击毁、Boss 生成与击破、敌弹伤害、重置和得分回调。"],["设备验证","桌面键盘、手机触控、暂停、音效和结算流程。"],["交付验证","生产构建通过，控制台没有 error / warn，手机没有横向溢出。"]],q:"可用工具不是“代码没有报错”，而是关键用户路径有证据。",f:"验证标准要覆盖行为、环境与交付",n:"指出每层验证回答的问题：规则对不对、能不能交付、用户能不能完成任务。"},
{k:"12 / 方法迁移",t:"换掉游戏场景，\n工程问题仍然成立",l:"把案例里的游戏术语换成业务术语，你会发现 AI 工具开发面对的是同一组问题。",m:[["游戏里的问题","业务工具里的对应物","共同工程方法"],["航道与碰撞","输入边界与异常数据","先定义规则，再测边界"],["HUD 与结算","状态、提示与交付结果","让用户知道现在发生了什么"],["手机触控","不同设备或运行环境","在真实环境中验证"],["Boss 与弹幕","复杂流程和高风险动作","分阶段扩展，保留人工确认"],["本地最高分","历史记录与可追踪性","保存证据，支持回归与迭代"]],f:"从案例中抽取方法，而不是只记住一个游戏项目",n:"这一页完成迁移：邀请观众把“航道、碰撞、结算”替换成自己业务里的边界、异常和交付。"},
{k:"13 / Skill 与 Harness",t:"Skill 是方法包；Harness 是\n让方法包稳定执行的系统",l:"当你把方法封装成 Skill，还需要一个能提供上下文、工具、测试和反馈的 Harness，才能稳定交付。",c:[["Skill","把一类工作的流程、判断、资料和输出格式封装起来。<small>例如：从会议记录提取行动项。</small>"],["Harness","提供项目上下文、工具、测试、权限、反馈和回滚，让 Agent 能完成任务。"],["关系","Skill 告诉 Agent 怎么做；Harness 让它有条件做、做完能验收。"],["共同原则","渐进式读取、最小权限、真实样例、可追溯输出。"]],cl:"two",q:"Skill 是可复用的方法；Harness 是方法得以运行和变好的工程环境。",f:"记住这组关系：方法包 × 工程系统",n:"结合会议纪要 Skill 说明：方法、依据、模板和测试分别承担不同职责，不能把它们混成一个词。"},
{k:"14 / 人与 AI",t:"AI 负责推进，\n人负责判断和承担责任",l:"Harness 不是把人从系统里拿掉，而是把人的注意力从低价值执行移到关键判断。",c:[["AI 适合做","搭建结构、补全代码、编写测试、定位报错、重复重构、生成初版。"],["人必须决定","需求价值、优先级、非目标、体验取舍和什么算完成。"],["人必须确认","发布、外部写入、敏感数据、不可逆操作和业务承诺。"]],cl:"dark",f:"最好的协作不是无人驾驶，而是人掌舵、Agent 持续推进",n:"把“责任”讲出来。工具越接近真实业务，人工确认和审计记录越不能省。"},
{k:"15 / 交付标准",t:"从 Demo 到工具，\n还差四个问题",l:"只要这四个问题答不上来，项目通常还停留在一次性演示。",c:[["能复现吗？","另一个人能按 README 启动，而不是依赖原作者的聊天上下文。"],["能验证吗？","关键路径有测试、样例或浏览器检查，而不是只看最终截图。"],["能回滚吗？","改动有版本和边界，失败后能恢复到上一个可用状态。"],["能继续改吗？","代码结构、文档和任务拆分让下一个 Agent 或人能接手。"]],f:"交付标准：可运行、可验证、可回滚、可维护",n:"用 orbit-game 的 README、tests、build 和 verification.md 一一对应这四个问题。"},
{k:"16 / 为什么做它",t:"一个值得 AI 帮你做的需求，\n通常有这三个信号",l:"不是所有想法都值得立刻开发。先判断投入之后能否获得真实反馈和重复收益。",c:[["重复出现","同一类流程每周或每天发生，人工做法已经形成规律。"],["结果可描述","完成与否能用行为、字段、状态或测试来判断。"],["风险可控制","可以先在本地、草稿或沙箱里验证，不必一开始接入生产系统。"]],q:"最适合 AI 开发的第一件事，不是最宏大的产品，而是最容易形成反馈的工作。",f:"选题标准：高频、可验收、低风险",n:"让观众用这三个信号检查自己的需求。没有重复性或无法验收的需求，不适合直接进入 Agent 开发。"},
{k:"18 / 模块边界",t:"模块化不是为了好看，\n而是为了让 Agent 改得动",l:"当一个功能可以落到相对清晰的模块，Agent 的改动范围更小，失败后的归因也更清楚。",m:[["模块","负责什么","不负责什么"],["scene.js","场景、几何体、灯光、背景","不决定积分和游戏状态"],["main.js","循环、输入、状态、HUD、音效调度","不承载全部碰撞细节"],["rules.js","碰撞、积分、难度等确定性规则","不处理 Three.js 渲染"],["combat.js","敌机、激光、敌弹、Boss","不修改基础场景结构"]],f:"清晰的职责边界，就是给 Agent 的可操作地图",n:"用“暂停问题”说明边界价值：先检查 main.js 的循环与状态，再查 rules，而不是把所有文件一起重写。"},
{k:"19 / 状态模型",t:"把玩法写成状态，\n比写一段形容词更可靠",l:"“手感很好”难以验证；“暂停时分数不增长、护盾不变化、恢复后继续”可以验证。",code:"游戏状态：\nREADY → PLAYING → PAUSED → PLAYING\n                  ↓\n                GAME_OVER\n\nPLAYING：接受变道、加速、碰撞和计分\nPAUSED：停止时间推进，保留画面与当前状态\nGAME_OVER：停止输入，显示结算，允许重置",a:"状态模型帮助 AI 处理边界，也帮助测试覆盖转移：开始、暂停、恢复、碰撞、结算和重试。",f:"把体验语言翻译成状态、事件和可观察结果",n:"引导观众看出：很多“体验问题”最后都能落到状态是否正确、事件是否被重复处理。"},
{k:"20 / 浏览器验收",t:"真正的用户路径，\n必须在真实界面里走一遍",l:"代码和测试通过之后，仍然要用桌面和手机按用户的方式操作，而不是只看源码。",flow:[["开始","点击开始，HUD 显示初始分数、速度和护盾"],["操作","左右变道，加速，收集能量"],["受损","撞击陨石，护盾减少并出现反馈"],["暂停","按钮或空格暂停，分数保持不变"],["结算","护盾耗尽，显示分数、时间和收集结果"],["重试","重新出发，状态和护盾正确恢复"]],f:"浏览器验证关注“用户能否完成任务”，不是“代码是否存在",n:"这一页适合现场演示或播放验证记录。每一个节点都对应一个可观察的结果。"},
{k:"21 / 测试证据",t:"测试要证明什么，\n也要诚实说明不证明什么",l:"单元测试可以覆盖规则和战斗行为；它不能替代设备、视觉和完整用户路径验证。",m:[["测试层","能证明","不能单独证明"],["rules.test.js","边界、碰撞、得分和难度规则","手机按钮是否可用"],["combat.test.js","跨帧命中、敌机、Boss、敌弹和重置","画面构图是否合格"],["npm run build","生产构建和打包可完成","真实用户是否喜欢"],["浏览器核对","操作、布局、状态和控制台","所有输入组合都没有问题"]],f:"证据要有范围：知道它覆盖什么，也知道它没有覆盖什么",n:"避免把“9 项测试通过”说成“产品绝对没有问题”。正确说法是：已覆盖的行为有证据。"},
{k:"22 / 功能扩展",t:"为什么后面还能加敌机和 Boss？\n因为基础 Harness 没被破坏",l:"扩展不是简单堆功能，而是沿着已有的模块、规则、测试和反馈回路增加能力。",c:[["复用资源","战斗模式复用场景和几何体资源，减少重复实现。"],["独立逻辑","combat.js 管理敌机、弹幕、激光和爆炸，避免主循环无限膨胀。"],["明确回调","击毁、受伤、得分和重置通过清晰的状态变化连接。"],["同步验证","新增行为同时补测试、试玩和结算检查。"]],q:"扩展能力的前提，不是 Agent 更敢改，而是项目更容易判断改动影响了什么。",f:"可扩展性来自边界、契约和回归，不来自代码数量",n:"把“Boss 加进来”拆成生成、移动、攻击、命中、奖励、清理和重置多个可验证行为。"},
{k:"23 / 两周试点",t:"把这套方法带回业务，\n用两周证明价值",l:"不需要一开始做完整产品。先用一个真实流程建立基线，再让 Harness 帮你减少耗时、返工或遗漏。",flow:[["第 1—2 天","选任务，写输入、输出、非目标和验收标准"],["第 3—5 天","整理项目上下文，准备真实与边界样例"],["第 1 周末","完成最小实现，跑自动检查和人工验收"],["第 2 周","连续使用，记录修正、遗漏、确认和成本"],["结束复盘","保留有效规则，删除临时做法，决定是否扩大范围"]],c:[["建议记录","平均耗时、返工率、采纳率、错误类型、人工介入次数"],["不要只看","模型回答是否漂亮，或 Demo 是否一次成功"]],f:"用证据决定是否继续投入，而不是用兴奋感决定",n:"可以把会议行动项、课程内容整理或日报生成作为业务试点。关键是先留基线。"},
{k:"24 / 收束前",t:"做工具之前，先写出\n这一张 Harness 设计卡",l:"把今天的内容压缩成一张可以带走、可以讨论、可以开始执行的卡片。",code:"需求：谁在什么场景下要解决什么问题？\n输入：有哪些材料？缺什么就必须停下来？\n输出：用户拿到什么？什么格式方便继续工作？\n上下文：Agent 必须知道哪些项目事实？\n约束：哪些文件、数据和动作不能碰？\n验证：用什么命令、样例、设备和人工标准验收？\n回滚：失败后如何比较、恢复和重新开始？",f:"把一次分享变成一个可执行的下一步",n:"留 2—3 分钟让观众拍照或填写这张卡。它是从听懂到开始做的桥梁。"},
{k:"25 / 收束",t:"AI 真正帮你做工具，\n靠的是工程闭环",l:"从一个真实需求开始，把上下文、约束、工具、反馈和验证组织起来，AI 才能从“写一段代码”走向“完成一项工作”。",c:[["第一步","选一个高频、低风险、边界清楚的需求。"],["第二步","写成任务卡：目标、文件、完成标准、验证命令。"],["第三步","建立 Harness：仓库上下文、权限边界、工具链和反馈回路。"],["第四步","用真实样例持续测试，保留失败记录和回归证据。"]],cl:"cover",q:"不要先问：AI 能不能替我做完所有事？\n先问：哪一段重复工作，值得被工程化？",f:"带走一个需求，做一个两周小试点",n:"收尾让每个人写下自己的需求，并补齐四句话：输入是什么、输出是什么、如何验收、哪些事不能自动做。"}
];
const deck=document.querySelector('#deck');function cards(a){return '<div class="grid '+(a.length===4||a.length===6?'two':'')+'">'+a.map(x=>'<div class="card"><span>'+x[0]+'</span>'+x[1]+'</div>').join('')+'</div>'}function flow(a){return '<div class="flow">'+a.map(x=>'<div class="node"><b>'+x[0]+'</b>'+x[1]+'</div>').join('')+'</div>'}function matrix(a){return '<div class="matrix">'+a.map((r,i)=>r.map(v=>'<div class="'+(i===0?'head':'')+'">'+v+'</div>').join('')).join('')+'</div>'}D.forEach((s,i)=>{let b='<section class="slide '+(s.cl||'')+'"><div class="kicker">'+s.k+'</div><h1>'+s.t+'</h1><p class="lead">'+s.l+'</p>';if(s.m)b+=matrix(s.m);if(s.code)b+='<div class="codebox">'+s.code+'</div>';if(s.a)b+='<p class="annotation">'+s.a+'</p>';if(s.flow)b+=flow(s.flow);if(s.c)b+=cards(s.c);if(s.q)b+='<div class="quote">'+s.q+'</div>';b+='<div class="foot"><span>'+s.f+'</span><span>'+String(i+1).padStart(2,'0')+' / '+D.length+'</span></div></section>';deck.insertAdjacentHTML('beforeend',b)});const slides=[...document.querySelectorAll('.slide')],select=document.querySelector('#jump'),notes=D.map(x=>x.n);let current=0;slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' '+s.querySelector('h1').textContent.replaceAll('\n',' ');select.append(o)});function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===current));document.querySelector('#counter').textContent=(current+1)+' / '+slides.length;document.querySelector('#notes').textContent='讲师提示：'+notes[current];document.querySelector('#bar').style.width=((current+1)/slides.length*100)+'%';select.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;history.replaceState(null,'','#'+(current+1))}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);select.onchange=()=>show(Number(select.value));document.querySelector('#toggle').onclick=()=>document.querySelector('#notes').classList.toggle('visible');document.querySelector('#print').onclick=()=>window.print();document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.matches('select,button,input'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#notes').classList.toggle('visible')});show(Math.max(0,(Number(location.hash.slice(1))||1)-1));
</script>
