    <rect x="58" y="1270" width="964" height="130" rx="20" fill="#252B2F"/>
    <text x="86" y="1322" font-size="22" fill="#FFFFFF" font-weight="700">模型变强只是起点</text>
    <text x="86" y="1360" font-size="18" fill="#D9DEDF">能否安全完成整项工作，取决于模型之外的系统。</text>
